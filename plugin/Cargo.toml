[package]
name = "amitoki-plugin-l3"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
amitoki-l3-lab = { path = ".." }
amitoki-plugin-sdk = { git = "https://github.com/amitoki/amitoki", rev = "d5000486d7e3d479e0c9482c50971ef8915262f0" }
async-trait = "0.1"
bytes = "1"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "amitoki-plugin-l3"
path = "src/main.rs"

[[bin]]
name = "amitoki-l3-broker"
path = "src/broker_main.rs"
