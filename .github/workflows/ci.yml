name: L3 plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l3-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s comparison -v
      - run: python3 -m py_compile lab/*.py comparison/*.py scripts/*.py
      - run: bash -n scripts/*.sh
      - run: bash scripts/test-plugin.sh artifacts/plugin/ci
      - run: bash scripts/test-l3.sh artifacts/l3/ci
        env:
          L3_REPETITIONS: 1
          L3_DURATION_MS: 1000
      - run: bash scripts/test-fabric.sh artifacts/fabric/ci
      - name: Verify all TCP comparison workloads including three-second congestion
        run: bash scripts/compare-l3-tcp.sh artifacts/l3-tcp/ci
        env:
          L3_REPETITIONS: 1
          L3_DURATION_MS: 3000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: network-results
          path: artifacts/
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm test
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fabric-web
          path: |
            web/dist/
            artifacts/web/
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: python3 scripts/package-plugin.py target/release/amitoki-plugin-l3 dist
      - name: Package the broker and protocol CLI separately from the unprivileged plugin
        run: |
          cp target/release/amitoki-l3-broker dist/amitoki-l3-broker-${{ matrix.target }}
          cp target/release/amitoki-l3 dist/amitoki-l3-${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [check, package, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the tag against the plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v"+tomllib.load(open("plugin/Cargo.toml","rb"))["package"]["version"]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and CLI installation manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *-unknown-linux-gnu plugin-*-unknown-linux-gnu.json > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY" \
            *-unknown-linux-gnu plugin-*-unknown-linux-gnu.json SHA256SUMS
